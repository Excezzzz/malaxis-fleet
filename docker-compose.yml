version: '3.8'

services:
  fleet-master:
    build: .
    container_name: fleet-master
    restart: always
    ports:
      - "8000:8000"
    environment:
      SERVER_PORT: "8000"
      WEB_PORT: "8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    depends_on:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    restart: always
    environment:
      POSTGRES_USER: fleet_internal
      POSTGRES_PASSWORD: fleet_internal_db_pass_2026
      POSTGRES_DB: fleet_db
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
