version: '3.8'

services:
  fleet-master:
    # Pre-built image (fast install, low RAM). When 'docker compose up -d --build'
    # is used instead, the image is built from source and tagged with the same
    # name locally.
    image: ghcr.io/excezzzz/malaxis-fleet:latest
    build:
      context: .
      args:
        # Override when npmjs.org is slow/blocked on your network, e.g.
        # NPM_REGISTRY=https://registry.npmmirror.com docker compose up -d --build
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: fleet-master
    restart: always
    # No host ports are published. The backend is reached ONLY through Caddy,
    # (which terminates TLS and reverse-proxies over the shared "caddy" network),
    # so nothing is exposed to the public internet.
    environment:
      SERVER_PORT: "8000"
      WEB_PORT: "8000"
      # The docker CLI talks to the read-restricted docker-socket-proxy sidecar
      # instead of the raw host socket (the "Logs & Audit" tab runs `docker logs`).
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    networks:
      - default
      - caddy
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    restart: always
    # PostgreSQL is NOT exposed to the host or the internet. The Go backend
    # connects over the internal Docker network (fleet-postgres:5432) only.
    # Credentials come from .env (POSTGRES_USER / POSTGRES_PASSWORD /
    # POSTGRES_DB). The defaults are generic and MUST be overridden.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleet_internal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-fleet_db}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Read-only Docker socket proxy: lets fleet-master run `docker logs` for the
  # "Logs & Audit" tab without granting it root-equivalent host access. Only
  # the container-log section is whitelisted (GET/HEAD only; POST denied).
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: fleet-docker-proxy
    restart: always
    environment:
      CONTAINERS: 1
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "1"

networks:
  caddy:
    external: true
