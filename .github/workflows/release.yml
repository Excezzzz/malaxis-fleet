name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-vue:
    name: Build Vue dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: internal/api/web/package-lock.json
      - name: Install dependencies
        working-directory: internal/api/web
        run: npm ci
      - name: Build production bundle
        working-directory: internal/api/web
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/api/web/dist
          retention-days: 7

  build-go:
    name: Cross-compile master_server (${{ matrix.os }}/${{ matrix.arch }})
    needs: build-vue
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ''
          - os: linux
            arch: arm64
            ext: ''
          - os: windows
            arch: amd64
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Download pre-built web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/api/web/dist
      - name: Cross-compile binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags="-s -w" -o "malaxis-fleet-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" ./cmd/server/main.go
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: malaxis-fleet-*

  build-docker:
    name: Build & push GHCR image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/excezzzz/malaxis-fleet:latest
            ghcr.io/excezzzz/malaxis-fleet:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
